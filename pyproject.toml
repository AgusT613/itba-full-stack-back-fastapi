[project]
name = "itba-full-stack-back-fastapi"
version = "0.1.0"
description = ""
authors = [{ name = "Agus Torres", email = "torresagustin613@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard] (>=0.116.1,<0.117.0)",
    "sqlmodel (>=0.0.24,<0.0.25)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "coolname (>=4.0.0,<5.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
env_files = [
    ".env.test"
]